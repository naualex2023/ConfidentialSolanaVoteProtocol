[package]
name = "csvp_protocol"
version = "0.2.0"
description = "Confidential Solana Vote Protocol"
edition = "2021"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "arcium-anchor/idl-build"]
# New optional features below
anchor-debug = []
custom-heap = []
custom-panic = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[dependencies]
thiserror = "1.0.0"
num-derive = "0.3.0"
num-traits = "0.2.0"
anchor-lang = { version = "0.32.1", features = ["init-if-needed","derive"] }
# Используйте актуальные версии Arcium
arcium-client = { version = "0.4.0", default-features = false }
arcium-macros = { version = "0.4.0" }
arcium-anchor = { version = "0.4.0" }
registration = { path = "../../programs/register-voters", features = ["no-entrypoint"] }

[lib]
crate-type = ["cdylib", "lib"]